{% extends 'livres_temp/base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ titre_page }}{% endblock %}

{% block content %}
<div class="page-header">
  <h1>
    <i class="bi bi-{% if livre %}pencil-square{% else %}plus-circle{% endif %} me-2"
       style="color:var(--accent)"></i>{{ titre_page }}
  </h1>
  <a href="{% url 'livre_list' %}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i> Retour
  </a>
</div>

<div class="card p-4" style="max-width:800px">
  <form method="post" novalidate>
    {% csrf_token %}
    {% crispy form %}
    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-primary px-4">
        <i class="bi bi-save me-1"></i> Enregistrer
      </button>
      <a href="{% url 'livre_list' %}" class="btn btn-outline-secondary">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
